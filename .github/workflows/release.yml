# v* 태그를 푸시하면 OS 별 배포 zip(Java 런타임 포함)을 만들어 GitHub Release 에 올린다
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스할 태그 (예: v0.2.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 수동 재실행인데 기존 태그가 다른 커밋이고 아직 올라간 파일이 없으면 → 지금 커밋으로 다시 만든다
            TAG_SHA=$(gh api "repos/${{ github.repository }}/commits/$TAG" --jq .sha 2>/dev/null || echo "")
            ASSETS=$(gh release view "$TAG" --json assets --jq '.assets | length')
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$TAG_SHA" != "$GITHUB_SHA" ] && [ "$ASSETS" = "0" ]; then
              echo "Recreating $TAG at $GITHUB_SHA (was $TAG_SHA)"
              gh release delete "$TAG" --cleanup-tag -y
              gh release create "$TAG" --target "$GITHUB_SHA" --title "sqlgraph-mcp $TAG" --generate-notes
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "sqlgraph-mcp $TAG" --generate-notes
          fi

  package:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest      # linux-x64
          - os: windows-latest     # windows-x64
          - os: macos-latest       # macos-arm64 (Apple Silicon)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Test and package
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build :server:packageDist --no-daemon --stacktrace 2>&1 | tee gradle.log
      - name: Report failures
        if: failure()
        shell: bash
        run: python3 .github/scripts/report_failures.py || python .github/scripts/report_failures.py
      - name: Smoke test (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          unzip -q -o server/build/dist/*.zip -d "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/sqlgraph/bin/sqlgraph" --version
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem server/build/dist/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\smoke" -Force
          & "$env:RUNNER_TEMP\smoke\sqlgraph\bin\sqlgraph.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" server/build/dist/*.zip --clobber
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Java 가 이미 있는 사용자용 단일 jar
            gh release upload "$TAG" server/build/libs/sqlgraph-mcp-*-all.jar --clobber
          fi

  # npm 배포
  #  - 첫 배포: 저장소 시크릿 NPM_TOKEN (npm Granular token) 으로 올린다
  #  - 이후: npm 패키지 설정에서 Trusted Publisher(GitHub Actions, 워크플로 release.yml)를 연결하고
  #          NPM_TOKEN 시크릿을 지우면 토큰 없이 OIDC 로 배포된다
  npm-publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Trusted Publishing(OIDC)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm (Trusted Publishing 은 npm 11.5.1 이상 필요)
        run: npm install -g npm@latest
      - name: Publish
        working-directory: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          if npm view "sqlgraph-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::sqlgraph-mcp@$VERSION 은 이미 npm 에 있습니다"
            exit 0
          fi
          if [ -n "$NPM_TOKEN" ]; then
            echo "토큰으로 배포"
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public
          elif npm view sqlgraph-mcp name >/dev/null 2>&1; then
            echo "Trusted Publishing(OIDC)으로 배포"
            unset NODE_AUTH_TOKEN
            npm publish --access public
          else
            echo "::notice::첫 npm 배포에는 NPM_TOKEN 시크릿이 필요합니다. 배포를 건너뜁니다"
          fi
