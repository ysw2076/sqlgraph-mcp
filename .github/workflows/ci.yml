# 푸시·PR 마다 빌드와 테스트
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # Windows 에서도 테스트
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee gradle.log
      - name: Report failures
        if: failure()
        run: python3 .github/scripts/report_failures.py || python .github/scripts/report_failures.py
